# Crop Extraction Configuration
# This file configures the crop extraction script

dataset_path: 'data/processed/farm_dataset'
output_dir: 'data/classification/farm_dataset_test'

# Crop settings
crop_size: null  # [width, height] or null for original size
padding: 0.1  # Default padding around bbox (0.1 = 10%)
class_padding:  # Class-specific padding overrides
  Green_Fruit: 0.2
  Flower_Fruit: 0.3

# Dataset organization
preserve_splits: true
merge_labels: false
