services:
  label-studio-nginx:
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    ports:
      - "8080:8085"
      - "8081:8086"
    depends_on:
      - app
    networks:
      - frontend
      - backend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - NGINX_SSL_CERT=/certs/cert.pem
      - NGINX_SSL_CERT_KEY=/certs/cert.key
    volumes:
      - ${ML_STACK_FOLDER}/label_studio_nginx:/label-studio/data:rw
      - ${ML_STACK_FOLDER}/nginx_certs:/certs:ro
    command: nginx

  app:
    stdin_open: true
    tty: true
    image: heartexlabs/label-studio:latest
    restart: unless-stopped
    expose:
      - "${LABEL_STUDIO_PORT}"
    depends_on:
      - label-studio-db
    networks:
      - backend
      - frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ${ML_STACK_FOLDER}/label_studio:/label-studio/data:rw
    environment:
      - LABEL_STUDIO_USERNAME=${USERNAME}
      - LABEL_STUDIO_PASSWORD=${PASSWORD}
      - DJANGO_DB=default
      - POSTGRE_NAME=postgres
      - POSTGRE_USER=postgres
      - POSTGRE_PASSWORD=
      - POSTGRE_PORT=${LS_DB_PORT}
      - POSTGRE_HOST=label-studio-db
      - LABEL_STUDIO_HOST=${LABEL_STUDIO_HOST:-}
      - JSON_LOG=1
    command: label-studio-uwsgi

  label-studio-db:
    image: pgautoupgrade/pgautoupgrade:13-alpine
    hostname: db
    restart: unless-stopped
    expose:
      - "${LS_DB_PORT}"
    networks:
      - backend
    environment:
      - POSTGRES_HOST_AUTH_METHOD=trust
      - POSTGRES_USER=postgres
    volumes:
      - ${ML_STACK_FOLDER}/label_studio_db:/var/lib/postgresql/data
    command: -p ${LS_DB_PORT}

  minio:
    image: minio/minio:latest
    container_name: minio
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    networks:
      - backend
      - frontend
    environment:
      - MINIO_ROOT_USER=${USERNAME}
      - MINIO_ROOT_PASSWORD=${PASSWORD}
    volumes:
      - ${ML_STACK_FOLDER}/minio/data:/data
    command: server /data --console-address ":9001"

  mlflow-db:
    user: "1001:1001"
    restart: always
    image: postgres:17
    container_name: mlflow_db
    expose:
      - "${PG_PORT}"
    networks:
      - backend
    environment:
      - POSTGRES_USER=${USERNAME}
      - POSTGRES_PASSWORD=${PASSWORD}
      - POSTGRES_DB=${PG_DATABASE}
    volumes:
      - ${ML_STACK_FOLDER}/db_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD", "pg_isready", "-p", "${PG_PORT}", "-U", "${USERNAME}", "-d", "${PG_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 3

  mlflow-tracking_server:
    restart: always
    build: ./mlflow
    image: mlflow_server
    container_name: mlflow_server
    depends_on:
      - mlflow-db
      - minio
    ports:
      - "${MLFLOW_PORT}:5000"
    networks:
      - frontend
      - backend
    environment:
      - AWS_ACCESS_KEY_ID=${USERNAME}
      - AWS_SECRET_ACCESS_KEY=${PASSWORD}
      - MLFLOW_S3_ENDPOINT_URL=http://minio:9000
      - MLFLOW_S3_IGNORE_TLS=true
    command: >
      mlflow server
      --backend-store-uri postgresql://${USERNAME}:${PASSWORD}@mlflow-db:${PG_PORT}/${PG_DATABASE}
      --host 0.0.0.0
      --serve-artifacts
      --artifacts-destination s3://${MLFLOW_BUCKET_NAME}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
