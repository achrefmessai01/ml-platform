# YOLO11 Training Configuration Example
# This file demonstrates how to configure training parameters

# Basic training parameters
model: "yolo11l-obb.pt"
data: "data/processed/combined_augmented_dataset/data.yaml"
task: "detect"
epochs: 200
batch-size: 8
img-size: 640
device: "0"  # Use first GPU
project: "runs/train"
name: "detection_l_strawberries_augmented"

# Training optimization parameters
patience: 10
single-cls: true
